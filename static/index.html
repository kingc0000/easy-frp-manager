<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRP Manager v1.1.1</title>
<link rel="stylesheet" href="/vendor/tailwind.css">
<style>
  :root {
    /* 基础色 */
    --bg:#0b0f1a;
    --bg-elevated:#111827;
    --panel:#131928;
    --panel-hover:#161e30;
    --border:#1f2937;
    --border-light:#374151;
    /* 语义色 */
    --accent:#3b82f6;
    --accent-hover:#2563eb;
    --text:#e5e7eb;
    --muted:#6b7280;
    --muted-light:#9ca3af;
    /* 状态色 */
    --success:#10b981; --success-bg:#065f46; --success-fg:#6ee7b7;
    --danger:#ef4444;  --danger-bg:#7f1d1d;  --danger-fg:#fca5a5;
    --warn:#f59e0b;    --warn-bg:#78350f;    --warn-fg:#fcd34d;
    --info:#3b82f6;    --info-bg:#1e3a8a;    --info-fg:#93c5fd;
    /* 阴影 */
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); font-size: 0.875rem; line-height: 1.5; }

  /* 面板:统一内边距 + 过渡 */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 0.5rem; transition: border-color 0.15s ease; }
  .panel:hover { border-color: var(--border-light); }
  .panel-hoverable:hover { background: var(--panel-hover); }

  /* 按钮体系:统一最小高度、间距、过渡、禁用态 */
  .btn-primary, .btn-danger, .btn-ghost, .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
    padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: 500; font-size: 0.875rem;
    cursor: pointer; border: none; transition: all 0.15s ease; white-space: nowrap; line-height: 1.25;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-sm); }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-danger:hover { background: #b91c1c; box-shadow: var(--shadow-sm); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-light); }
  .btn-ghost:hover { background: #1f2937; border-color: var(--muted); }
  .btn-secondary { background: #1f2937; color: var(--text); border: 1px solid var(--border-light); }
  .btn-secondary:hover { background: #2d3748; }
  .btn-primary:disabled, .btn-danger:disabled, .btn-ghost:disabled, .btn-secondary:disabled {
    opacity: 0.5; cursor: not-allowed; pointer-events: none;
  }
  /* 小按钮变体(表格行内) */
  .btn-sm { padding: 0.25rem 0.625rem; font-size: 0.75rem; }
  .btn-icon { padding: 0.25rem 0.5rem; font-size: 0.875rem; }

  /* 输入框 */
  .input { background: #0b1220; border: 1px solid var(--border-light); color: var(--text); padding: 0.4rem 0.6rem; border-radius: 0.375rem; width: 100%; font-size: 0.875rem; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .input:disabled { opacity: 0.5; cursor: not-allowed; }
  .input:invalid:not(:placeholder-shown) { border-color: var(--danger); }
  /* 校验提示 */
  .field-error { color: var(--danger-fg); font-size: 0.75rem; margin-top: 0.25rem; display: none; }
  .field-error.visible { display: block; }
  .field-hint { color: var(--muted); font-size: 0.75rem; margin-top: 0.25rem; }

  /* nginx 配置预览框:用纯 CSS 而非 Tailwind 工具类(本地打包版不扫描 h-[44rem] 这类任意值) */
  .nginx-modal { max-height: 92vh; overflow-y: auto; }
  .nginx-preview-box { height: 22rem; min-height: 14rem; resize: vertical; overflow: auto; }

  /* Badge:统一内边距 + 图标支持 */
  .badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.15rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; line-height: 1.25; }
  .badge-green { background: var(--success-bg); color: var(--success-fg); }
  .badge-red { background: var(--danger-bg); color: var(--danger-fg); }
  .badge-gray { background: #1f2937; color: #9ca3af; }
  .badge-blue { background: var(--info-bg); color: var(--info-fg); }
  .badge-yellow { background: var(--warn-bg); color: var(--warn-fg); }

  /* 状态点:小圆点,配合文字表示运行状态 */
  .dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 9999px; flex-shrink: 0; }
  .dot-green { background: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
  .dot-red { background: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.2); }
  .dot-gray { background: var(--muted); }
  .dot-yellow { background: var(--warn); box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
  .dot-pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Tab */
  .tab-active { background: var(--accent); color: white; }
  .tab-inactive { color: var(--muted); }
  .tab-inactive:hover { color: var(--text); background: rgba(255,255,255,0.05); }

  /* 表格:斑马纹 + hover + 表头样式 + 滚动 */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border-light); color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.025em; white-space: nowrap; }
  td { padding: 0.625rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; vertical-align: middle; }
  tbody tr { transition: background-color 0.1s ease; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody tr:nth-even() { background: rgba(255,255,255,0.015); }
  tbody tr:nth-even():hover { background: rgba(255,255,255,0.04); }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll table { min-width: 640px; }
  /* 行内紧凑表格(用于代理列表) */
  table.compact td { padding: 0.375rem 0.5rem; }

  /* 模态框 */
  .modal-bg { background: rgba(0,0,0,0.7); backdrop-filter: blur(2px); }
  .modal-panel { background: var(--panel); border: 1px solid var(--border-light); border-radius: 0.5rem; box-shadow: var(--shadow-lg); }

  /* Toast */
  #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; }
  .toast { padding: 0.75rem 1rem; border-radius: 0.5rem; color: white; font-size: 0.875rem; min-width: 200px; box-shadow: var(--shadow-md); animation: slideIn 0.3s; display: flex; align-items: center; gap: 0.5rem; }
  .toast-success { background: #065f46; border-left: 4px solid #10b981; }
  .toast-error { background: #7f1d1d; border-left: 4px solid #ef4444; }
  .toast-info { background: #1e3a8a; border-left: 4px solid #3b82f6; }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* 折叠面板 */
  details { background: var(--panel); border: 1px solid var(--border); border-radius: 0.5rem; }
  details summary { cursor: pointer; padding: 0.75rem 1rem; list-style: none; font-weight: 500; display: flex; align-items: center; justify-content: space-between; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: '▾'; color: var(--muted); transition: transform 0.2s; }
  details[open] summary::after { transform: rotate(180deg); }
  details[open] summary { border-bottom: 1px solid var(--border); }

  /* 复选框行 */
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0; cursor: pointer; }
  .checkbox-row input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: var(--accent); cursor: pointer; }

  /* 代码块 */
  code { background: #0b1220; padding: 0.1rem 0.3rem; border-radius: 0.2rem; font-size: 0.875rem; color: var(--info-fg); }
  pre { background: #0b1220; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.75rem 1rem; overflow-x: auto; font-size: 0.8125rem; line-height: 1.5; }
  pre code { background: transparent; padding: 0; color: inherit; }

  /* 加载转圈 */
  .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
  .spinner-blue { border-color: var(--accent); border-top-color: transparent; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Skeleton:加载中的占位 */
  .skeleton { background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%); background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite; border-radius: 0.25rem; color: transparent; }
  .skeleton-text { height: 0.875rem; margin-bottom: 0.5rem; }
  .skeleton-block { height: 3rem; margin-bottom: 0.75rem; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* 空状态 */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1rem; color: var(--muted); text-align: center; gap: 0.75rem; }
  .empty-state-icon { font-size: 2.5rem; opacity: 0.5; }
  .empty-state-title { font-size: 0.875rem; font-weight: 500; color: var(--text); }
  .empty-state-desc { font-size: 0.75rem; max-width: 24rem; }
  .empty-state-action { margin-top: 0.5rem; }

  /* 面包屑 */
  .breadcrumb { display: flex; align-items: center; gap: 0.375rem; font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem; }
  .breadcrumb a { color: var(--info-fg); cursor: pointer; text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb .sep { color: var(--border-light); }
  .breadcrumb .current { color: var(--text); font-weight: 500; }

  /* 导航菜单高亮 */
  .nav-item { padding: 0.375rem 0.75rem; border-radius: 0.375rem; color: var(--muted); cursor: pointer; font-size: 0.875rem; transition: all 0.15s ease; border: 1px solid transparent; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-item.active { color: var(--info-fg); background: var(--info-bg); border-color: rgba(59,130,246,0.3); }

  /* 响应式:窄屏下调整 */
  @media (max-width: 768px) {
    body { font-size: 0.8125rem; }
    main { padding: 0.75rem !important; }
    .grid-cols-2 { grid-template-columns: 1fr !important; }
    .grid-cols-3 { grid-template-columns: 1fr !important; }
    header > div { padding: 0.5rem 0.75rem !important; flex-wrap: wrap; }
    .toast { min-width: 0; font-size: 0.75rem; padding: 0.5rem 0.75rem; }
    .empty-state { padding: 1.5rem 0.5rem; }
  }
  @media (max-width: 480px) {
    .panel { border-radius: 0.375rem; }
    .btn-primary, .btn-danger, .btn-ghost, .btn-secondary { padding: 0.4rem 0.75rem; font-size: 0.8125rem; }
  }

  /* 操作加载蒙版:点击 启动/停止/重启/删除/保存 等操作时盖住页面,防止重复点击并告知用户正在处理 */
  #busy-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; }
  #busy-overlay.active { display: flex; }
  .busy-box { display: flex; flex-direction: column; align-items: center; gap: 0.875rem; padding: 1.25rem 1.75rem; background: #111827; border: 1px solid #374151; border-radius: 0.5rem; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .busy-box .spinner { width: 1.75rem; height: 1.75rem; border-width: 3px; border-color: #3b82f6; border-top-color: transparent; }
  .busy-box .busy-msg { color: #e5e7eb; font-size: 0.875rem; }

  /* 工具类:长文本截断 + tooltip */
  .truncate-cell { max-width: 12rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .truncate-wide { max-width: 20rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 鼠标悬停时显示完整标题 */
  .truncate-cell[title], .truncate-wide[title] { cursor: help; }
</style>
</head>
<body class="min-h-screen">
<!-- 登录遮罩层 -->
<div id="login-overlay" class="fixed inset-0 z-50 bg-black flex items-center justify-center" style="display:none;">
  <div class="panel p-8 w-96 shadow-2xl">
    <div class="flex items-center gap-3 mb-6">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg>
      <div>
        <h2 class="text-xl font-bold">FRP Manager</h2>
        <p class="text-sm text-gray-500">登录后继续</p>
      </div>
    </div>
    <div id="login-error" class="mb-4 p-3 rounded bg-red-900/30 border border-red-700 text-red-300 text-sm hidden"></div>
    <form onsubmit="doLogin(event)">
      <div class="mb-3">
        <label class="block text-sm text-gray-400 mb-1">用户名</label>
        <input type="text" id="login-username" class="input" value="admin" required autofocus>
      </div>
      <div class="mb-4">
        <label class="block text-sm text-gray-400 mb-1">密码</label>
        <input type="password" id="login-password" class="input" required>
      </div>
      <button type="submit" class="btn-primary w-full py-2">登录</button>
    </form>
    <p class="text-xs text-gray-600 mt-4 text-center">
      <a href="javascript:void(0)" onclick="showForgotPasswordModal()" style="color:#93c5fd;text-decoration:none;border-bottom:1px dashed #4b5563;">忘记密码？点击这里查看恢复步骤</a>
    </p>
  </div>
</div>
<div id="app">
  <!-- 顶栏 -->
  <header class="border-b border-gray-800 bg-gray-900/50 sticky top-0 z-40 backdrop-blur">
    <div class="px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg class="w-6 h-6 text-blue-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6.01 18H6"/><path d="M10.01 18H10"/><path d="M15 10v4"/><path d="M17.84 7.17a4 4 0 0 0-5.66 0"/><path d="M20.66 4.34a8 8 0 0 0-11.31 0"/></svg>
        <h1 class="text-lg font-semibold">FRP Manager</h1>
        <span id="host-info" class="text-sm text-gray-500"></span>
      </div>
      <div class="flex items-center gap-4">
        <div id="user-info" class="hidden"></div>
      </div>
    </div>
  </header>

  <main class="p-6 max-w-7xl mx-auto">
    <!-- 实例管理页 -->
    <div id="view-instances"></div>
    <!-- 实例详情页 -->
    <div id="view-detail" class="hidden"></div>
  </main>

  <!-- 操作加载蒙版(启动/停止/重启/删除/保存等) -->
  <div id="busy-overlay">
    <div class="busy-box">
      <span class="spinner"></span>
      <span class="busy-msg" id="busy-msg">正在处理...</span>
    </div>
  </div>
</div>

<!-- 模态框容器 -->
<div id="modal-container" class="fixed inset-0 modal-bg hidden items-center justify-center z-50"></div>
<!-- Toast 容器 -->
<div id="toast-container"></div>

<script>
// ============ 登录相关 ============
function showLogin(message) {
  authToken = '';
  localStorage.removeItem('frpm_token');
  localStorage.removeItem('frpm_username');
  // 重置登录表单(防止上次成功登录后按钮残留 disabled 状态)
  const btn = document.getElementById('login-overlay').querySelector('button[type="submit"]');
  if (btn) { btn.disabled = false; btn.textContent = '登录'; }
  document.getElementById('login-password').value = '';
  const overlay = document.getElementById('login-overlay');
  if (overlay) {
    overlay.style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
  const err = document.getElementById('login-error');
  if (err) {
    if (message) {
      err.textContent = message;
      err.classList.remove('hidden');
    } else {
      err.classList.add('hidden');
    }
  }
}

function hideLogin() {
  const overlay = document.getElementById('login-overlay');
  if (overlay) overlay.style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function doLogin(event) {
  event.preventDefault();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  const btn = event.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = '登录中...';
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password}),
    });
    const data = await resp.json().catch(()=>({}));
    if (!resp.ok) {
      errEl.textContent = data.error || '登录失败';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = '登录';
      return;
    }
    authToken = data.token;
    currentUsername = data.username;
    localStorage.setItem('frpm_token', data.token);
    localStorage.setItem('frpm_username', data.username);
    hideLogin();
    toast('登录成功,欢迎 ' + data.username, 'success');
    renderUserInfo();
    // 登录成功后立刻显示实例列表(不等 dashboard 慢请求)
    nav('instances');
    // 后台加载 dashboard 状态条数据，完成后刷新实例列表以显示主机信息
    loadDashboard().then(() => {
      if (currentView === 'instances') loadInstances();
    });
  } catch(e) {
    errEl.textContent = e.message || '网络错误';
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = '登录';
  }
}

async function doLogout() {
  if (!confirm('确定要退出登录吗?')) return;
  try {
    await fetch('/api/auth/logout', {method: 'POST', headers: {'Content-Type':'application/json'}}).catch(()=>{});
  } catch(e) {}
  showLogin('已退出登录');
}

// ============ 忘记密码:提示恢复步骤 ============
// 不提供"一键重置"按钮——那等于给任何能打开登录页的人接管实例的权限。
// 重置必须由管理员在服务器本机上手动执行(有 shell 访问权限的人才有资格)。
// 这里只展示步骤,不执行任何操作。
function showForgotPasswordModal() {
  document.getElementById('modal-container').innerHTML = `
    <div class="panel p-6 w-[36rem] max-w-[92%] max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">🔑 忘记密码？</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
      </div>
      <div class="mb-4 p-3 rounded bg-yellow-900/30 border border-yellow-700 text-yellow-200 text-sm">
        ⚠️ 出于安全考虑,面板不提供一个键重置密码的按钮(否则任何能打开登录页的人都能接管实例)。
        重置必须由管理员在 <span class="font-mono">frpm 所在服务器本机</span> 手动执行。
      </div>
      <p class="text-sm text-gray-400 mb-2">在服务器上 SSH 登录后,执行下面任一命令:</p>

      <div class="mb-3">
        <p class="text-xs text-gray-500 mb-1">方式 1:删凭证文件 + 重启容器(推荐,最简单)</p>
        <code class="block p-3 bg-gray-950 text-green-300 text-sm font-mono overflow-x-auto">docker exec frpm rm -f /data/frpm-configs/auth.json &amp;&amp; docker restart frpm</code>
      </div>

      <div class="mb-3">
        <p class="text-xs text-gray-500 mb-1">方式 2:让程序自己生成默认凭证(等效)</p>
        <code class="block p-3 bg-gray-950 text-green-300 text-sm font-mono overflow-x-auto">docker exec frpm python3 -c "import auth; print(auth.reset_auth_config())"</code>
      </div>

      <p class="text-sm text-gray-300 mb-4">执行后用默认账号登录:<br>
        用户名 <span class="font-mono text-cyan-300">admin</span> / 密码 <span class="font-mono text-cyan-300">admin123</span><br>
        登录成功后请立刻在右上角「账户设置」里改回你自己的密码。
      </p>

      <p class="text-xs text-gray-500 leading-relaxed">
        前提:容器需要把 <span class="font-mono">/data/frpm-configs</span> 挂载到宿主机(用官方 deploy-docker.sh 部署会自动带上)。
        如果用的是 Docker UI 手动部署、且没挂这个目录,那凭证本来就存在容器里,删容器后会自动回到默认值。
      </p>

      <div class="flex justify-end mt-4">
        <button onclick="closeModal()" class="btn-ghost px-4 py-2">知道了</button>
      </div>
    </div>
  `;
  document.getElementById('modal-container').classList.remove('hidden');

    currentUsername = data.username || currentUsername;
    localStorage.setItem('frpm_username', currentUsername);
    hideLogin();

}

// ============ 工具函数 ============
async function api(url, options={}) {
  const headers = { 'Content-Type': 'application/json' };
  // 自动附加认证 token
  if (authToken) {
    headers['Authorization'] = 'Bearer ' + authToken;
  }
  // busy:true 的操作类请求自动盖加载蒙版(防重复点击 + 告知用户);
  // 传自定义文案用 busy:'正在重启实例 nas-web...'
  const busyOpt = options.busy;
  const showBusyOpt = busyOpt === true || typeof busyOpt === 'string';
  if (showBusyOpt) showBusy(typeof busyOpt === 'string' ? busyOpt : '正在处理...');
  const opts = { ...options, headers: { ...headers, ...(options.headers || {}) } };
  delete opts.busy;
  try {
    const resp = await fetch(url, opts);
    // 401:会话已过期/未登录 —— 清 token,跳登录,并抛错让调用方停止后续操作
    if (resp.status === 401) {
      localStorage.removeItem('frpm_token');
      authToken = '';
      showLogin('');  // 不显示错误消息,直接显示登录页
      const err = new Error('会话已过期,请重新登录');
      err.authExpired = true;  // 标记,调用方据此跳过 toast
      throw err;
    }
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    return data;
  } finally {
    if (showBusyOpt) hideBusy();
  }
}

// ============ 操作加载蒙版 ============
// 点击 启动/停止/重启/删除/保存 等耗时操作时,盖住页面防止重复点击,并显示正在做什么。
let busyCount = 0;
function showBusy(msg) {
  busyCount++;
  if (busyCount === 1) {
    document.getElementById('busy-msg').textContent = msg || '正在处理...';
    document.getElementById('busy-overlay').classList.add('active');
  }
}
function hideBusy() {
  busyCount = Math.max(0, busyCount - 1);
  if (busyCount === 0) {
    document.getElementById('busy-overlay').classList.remove('active');
  }
}


// 全局兜底:未捕获的 promise rejection(裸 await api(...) 调用点),
// 401 静默(已跳登录);其他错误只在控制台警告,不打扰用户。
window.addEventListener('unhandledrejection', (event) => {
  const err = event.reason;
  if (err && err.authExpired) {
    event.preventDefault();
    return;
  }
  if (err && err.message) {
    console.warn('未处理的 API 错误:', err.message);
  }
});

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024; const sizes = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
}

function formatUptime(s) {
  if (!s) return '-';
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  if (d) return `${d}天${h}小时`;
  if (h) return `${h}小时${m}分`;
  return `${m}分钟`;
}

function timeAgo(ts) {
  if (!ts) return '-';
  const diff = Date.now()/1000 - ts;
  if (diff < 60) return `${Math.floor(diff)}秒前`;
  if (diff < 3600) return `${Math.floor(diff/60)}分钟前`;
  if (diff < 86400) return `${Math.floor(diff/3600)}小时前`;
  return `${Math.floor(diff/86400)}天前`;
}

function renderProxiesSection() {
  const html = newInstanceState.proxies.map((p, i) => renderProxyRow(p, i)).join('');
  document.getElementById('proxies-section').innerHTML = html || '<p class="text-center text-gray-500 text-sm py-2">暂无代理规则</p>';
}

function renderProxyRow(p, i) {
  const isHttp = ['http','https'].includes(p.type);
  const isTunnel = ['stcp','xtcp'].includes(p.type);
  const typeLabels = {
    tcp: 'TCP 端口转发(最常用,SSH/网页/数据库都行)',
    udp: 'UDP 端口转发(DNS/游戏服务器等)',
    http: 'HTTP 反向代理(按域名路由,需要 frps 配 vhostHTTPPort)',
    https: 'HTTPS 反向代理(按域名路由,需要 frps 配 vhostHTTPSPort)',
    stcp: '加密 TCP 隧道(需要访问者也跑 frpc,安全性高)',
    xtcp: '点对点加密隧道(尝试直连,不通再走 frps 中转)',
  };
  return `
    <div class="border border-gray-700 rounded p-3 relative" id="proxy-${i}">
      <button type="button" onclick="removeProxy(${i})" class="absolute top-2 right-2 text-gray-500 hover:text-red-400 text-lg">&times;</button>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label class="block text-xs text-gray-500 mb-1">名称</label>
          <input type="text" value="${escapeHtml(p.name||'')}" data-field="name" class="input">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">类型</label>
          <select data-field="type" onchange="onProxyTypeChange(${i}, this.value)" class="input">
            <option value="tcp" ${p.type==='tcp'?'selected':''}>tcp — TCP 转发</option>
            <option value="udp" ${p.type==='udp'?'selected':''}>udp — UDP 转发</option>
            <option value="http" ${p.type==='http'?'selected':''}>http — HTTP 代理</option>
            <option value="https" ${p.type==='https'?'selected':''}>https — HTTPS 代理</option>
            <option value="stcp" ${p.type==='stcp'?'selected':''}>stcp — 加密隧道</option>
            <option value="xtcp" ${p.type==='xtcp'?'selected':''}>xtcp — 点对点隧道</option>
          </select>
        </div>
      </div>
      <p class="text-xs text-blue-400 mb-2">${typeLabels[p.type] || ''}</p>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-500 mb-1">服务在哪个地址? (localIP)</label>
          <input type="text" value="${escapeHtml(p.local_ip||'127.0.0.1')}" data-field="local_ip" class="input">
          <p class="text-xs text-gray-600 mt-1">127.0.0.1 = 就在本机(NAS自己)。一般不用改</p>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">NAS 上的服务端口 (localPort)</label>
          <input type="number" value="${p.local_port||''}" data-field="local_port" class="input">
          <p class="text-xs text-gray-600 mt-1">你要穿透的服务,在 NAS 上跑的端口</p>
        </div>
      </div>
      ${isHttp ? `
      <div class="mt-2 p-2 bg-yellow-900/20 border border-yellow-700/40 rounded text-xs text-yellow-300">
        ⚠️ <b>http/https 代理必须填域名</b>,否则 frps 不知道把哪个网址的请求转发给你,代理会启动失败。下方"远程端口"不适用。
      </div>
      <div class="mt-2">
        <label class="block text-xs text-gray-500 mb-1">域名 (逗号分隔)</label>
        <input type="text" value="${escapeHtml((p.custom_domains||[]).join(','))}" data-field="custom_domains" class="input" placeholder="vault.example.com, api.example.com">
        <p class="text-xs text-gray-600 mt-1">完整域名,多个用逗号分隔。如: vault.example.com, api.example.com</p>
      </div>
      <div class="mt-2">
        <label class="block text-xs text-gray-500 mb-1">子域名前缀(可选,与域名二选一)</label>
        <input type="text" value="${escapeHtml(p.subdomain||'')}" data-field="subdomain" class="input" placeholder="vault">
        <p class="text-xs text-gray-600 mt-1">只填前缀,由 frps 自动拼域名。需服务器配了 subdomainHost 才可用</p>
      </div>` : `
      <div class="mt-2">
        <label class="block text-xs text-gray-500 mb-1">云主机上开放的端口 (remotePort)</label>
        <input type="number" value="${p.remote_port||''}" data-field="remote_port" class="input">
        <p class="text-xs text-gray-600 mt-1">访问者通过 <code>example.com:这个端口</code> 到达 NAS。在 2000-2050 内选,别跟已用的冲突</p>
      </div>`}
      ${isTunnel ? `
      <div class="mt-2">
        <label class="block text-xs text-gray-500 mb-1">密钥 (secretKey)</label>
        <input type="text" value="${escapeHtml(p.secret_key||'')}" data-field="secret_key" class="input">
      </div>` : ''}
    </div>
  `;
}

function addServer() {
  newInstanceState.servers.push({ name: 'srv'+(newInstanceState.servers.length+1), serverAddr: '', serverPort: 2005, token: '' });
  renderServersSection();
}
function removeServer(i) {
  newInstanceState.servers.splice(i, 1);
  renderServersSection();
}
function addProxy() {
  const n = newInstanceState.proxies.length + 1;
  newInstanceState.proxies.push({ name: 'proxy'+n, type: 'tcp', local_ip: '127.0.0.1', local_port: 80, remote_port: 8080+n, custom_domains: [] });
  renderProxiesSection();
}
function removeProxy(i) {
  newInstanceState.proxies.splice(i, 1);
  renderProxiesSection();
}
function onProxyTypeChange(i, val) {
  newInstanceState.proxies[i].type = val;
  // 切换类型时,根据新类型补默认字段
  if (['http','https'].includes(val)) {
    newInstanceState.proxies[i].custom_domains = ['example.com'];
    delete newInstanceState.proxies[i].remote_port;
  } else if (['tcp','udp'].includes(val)) {
    newInstanceState.proxies[i].remote_port = newInstanceState.proxies[i].remote_port || (8080+i+1);
    delete newInstanceState.proxies[i].custom_domains;
  } else if (['stcp','xtcp'].includes(val)) {
    newInstanceState.proxies[i].secret_key = newInstanceState.proxies[i].secret_key || '';
  }
  renderProxiesSection();
}
function onTypeChange(val) {
  // 切换 frps/frpc 时,重置配置字段
  newInstanceState.type = val;
  if (val === 'frpc') {
    newInstanceState.servers = newInstanceState.servers.length ? newInstanceState.servers : [{ name: 'default', serverAddr: '', serverPort: 2005, token: '' }];
    newInstanceState.proxies = newInstanceState.proxies.length ? newInstanceState.proxies : [{ name: 'proxy1', type: 'tcp', local_ip: '127.0.0.1', local_port: 80, remote_port: 8080, custom_domains: [] }];
  } else {
    newInstanceState.servers = [];
    newInstanceState.proxies = [];
  }
  renderConfigFields();
}
function onDeployChange(val) {
  newInstanceState.deploy_mode = val;
}

function toggleWsFields() {
  const checkbox = document.getElementById('ws-enable');
  const fields = document.getElementById('ws-fields');
  if (fields) {
    fields.classList.toggle('hidden', !checkbox.checked);
  }
}

function generateToken(btn) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let token = '';
  for (let i = 0; i < 32; i++) token += chars[Math.floor(Math.random()*chars.length)];
  btn.previousElementSibling.value = token;
  toast('已生成 32 位随机 token', 'info');
}

// ============ 收集表单数据 → 提交 ============
function collectFormData() {
  const form = document.getElementById('newInstanceForm');
  if (!form) return null;
  const data = {
    name: form.querySelector('[name=name]').value.trim(),
    type: form.querySelector('[name=type]').value,
    deploy_mode: 'binary',
    config: {},
  };
  if (data.type === 'frps') {
    ['bind_addr','bind_port','auth_token','transport_heartbeat_interval','transport_heartbeat_ttl','allow_arbitrary_ports'].forEach(f => {
      const el = form.querySelector(`[name=${f}]`);
      if (el) data.config[f] = (el.type === 'checkbox') ? el.checked : el.value;
    });
    data.config.bind_port = parseInt(data.config.bind_port);
    data.config.transport_heartbeat_interval = parseInt(data.config.transport_heartbeat_interval);
    data.config.transport_heartbeat_ttl = parseInt(data.config.transport_heartbeat_ttl);
    // webServer (Dashboard) - 仅当启用时收集
    const wsEnable = document.getElementById('ws-enable');
    if (wsEnable && wsEnable.checked) {
      const wsAddr = form.querySelector('[name=web_server_addr]');
      const wsPort = form.querySelector('[name=web_server_port]');
      const wsUser = form.querySelector('[name=web_server_user]');
      const wsPass = form.querySelector('[name=web_server_password]');
      if (wsAddr) data.config.web_server_addr = wsAddr.value;
      if (wsPort) data.config.web_server_port = parseInt(wsPort.value);
      if (wsUser) data.config.web_server_user = wsUser.value;
      if (wsPass && wsPass.value) data.config.web_server_password = wsPass.value;
    }
  } else {
    // frpc:传输配置(心跳间隔/TCP复用)在顶层表单,直接按 name 收集
    const hbInterval = form.querySelector('[name=transport_heartbeat_interval]');
    if (hbInterval) data.config.transport_heartbeat_interval = parseInt(hbInterval.value) || 0;
    const tcpMux = form.querySelector('[name=transport_tcp_mux]');
    if (tcpMux) data.config.transport_tcp_mux = tcpMux.checked;
    // 直接从 DOM 收集 servers 和 proxies
    const servers = [];
    document.querySelectorAll('[id^="server-"]').forEach(el => {
      const f = {};
      el.querySelectorAll('[data-field]').forEach(inp => {
        f[inp.dataset.field] = inp.value;
      });
      f.serverPort = parseInt(f.serverPort) || 2005;
      servers.push(f);
    });
    const proxies = [];
    document.querySelectorAll('[id^="proxy-"]').forEach(el => {
      const f = {};
      el.querySelectorAll('[data-field]').forEach(inp => {
        f[inp.dataset.field] = inp.value;
      });
      f.local_port = parseInt(f.local_port) || 0;
      f.remote_port = parseInt(f.remote_port) || undefined;
      if (f.custom_domains) f.custom_domains = f.custom_domains.split(',').map(s=>s.trim()).filter(Boolean);
      else f.custom_domains = [];
      proxies.push(f);
    });
    data.config.servers = servers;
    data.config.proxies = proxies;
  }
  return data;
}

async function submitNewInstance(e) {
  e.preventDefault();
  const data = collectFormData();
  if (!data) return;
  if (!data.name) { toast('请输入实例名', 'error'); return; }
  try {
    const result = await api('/api/instances', { method: 'POST', body: JSON.stringify(data), busy: '正在创建实例...' });
    toast('实例创建成功', 'success');
    closeModal();
    await loadDashboard();
    nav('instances');
    if (result.container && !result.container.success) {
      toast(`容器创建失败: ${result.container.error||''}`, 'error');
    }
  } catch (e) {
    if (e && e.authExpired) return;
    toast(`创建失败: ${e.message}`, 'error');
  }
}

async function loadFrpsStatus(id) {
  try {
    const data = await api(`/api/instances/${id}/frps-status`);
    frpsStatusData = data;
    // 只渲染 frps 状态面板(不重绘整个 detail 页)
    const panel = document.getElementById('frps-status-panel');
    if (panel) panel.outerHTML = renderFrpsStatusPanel(id);
  } catch (e) {
    if (e && e.authExpired) return;
    const panel = document.getElementById('frps-status-panel');
    if (panel) panel.innerHTML = `<div class="text-red-400 text-sm">加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm mb-4">

      </div>
      <div class="panel-hoverable bg-gray-900 rounded p-3">
        <p class="text-xs text-gray-500 mb-1">出站流量</p>
        <p class="text-lg font-semibold text-yellow-400">${fmtBytes(si.totalTrafficOut)}</p>
      </div>
    </div>
  `;

  let proxiesHtml;

      <div class="empty-state">

  return `<div class="panel p-4 mb-4" id="frps-status-panel">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-medium text-sm">实时状态 (frps dashboard)</h3>

async function startLogStream(id) {
  if (logStream) logStream.close();
  const lines = await api(`/api/instances/${id}/logs?lines=100`).then(d => d.logs).catch(() => '');
  document.getElementById('log-output').textContent = lines;
  // SSE 实时流
  const evtSource = new EventSource(`/api/instances/${id}/logs?stream=1`);
  evtSource.onmessage = (e) => {
    const el = document.getElementById('log-output');
    el.textContent += e.data;
    el.scrollTop = el.scrollHeight;
  };
  evtSource.onerror = () => {
    evtSource.close();
  };
  logStream = evtSource;
}

function toggleLogStream() {
  const btn = document.getElementById('stream-btn');
  if (logStream) {
    logStream.close();
    logStream = null;
    btn.textContent = '▶ 继续';
  } else {
    const id = detailInstance?.id;
    if (id) startLogStream(id);
    btn.textContent = '⏸ 暂停';
  }
}

// ============ 域名穿透指南 ============
let nginxGuideState = { instanceId: null, proxyId: null, proxy: null, instance: null };

function showNginxConfigForFrpsProxy(instanceId, proxyIndex) {
  // 从 frps 实时状态里取指定索引的代理(nginx 配置指南的入口在 frps 详情页代理列表)
  const proxies = (frpsStatusData && frpsStatusData.proxies) || [];
  const p = proxies[proxyIndex];
  if (!p) {
    toast('未找到该代理,请先刷新实时状态', 'error');
    return;
  }
  const conf = p.conf || {};
  const domains = conf.customDomains || (conf.subdomain ? [conf.subdomain] : []);
  if (!domains.length) {
    toast('该代理未配置域名', 'error');
    return;
  }
  // 构造 frpm 代理结构(兼容 generateNginxConfigLive)
  nginxGuideState = {
    instanceId,
    vhostPort: parseVhostPortFromConfig(),
    proxy: {
      name: p.name || 'proxy',
      type: p._type || 'http',
      id: '-',
      custom_domains: domains,
      local_ip: conf.localIP || '127.0.0.1',
      local_port: conf.localPort || 80,
    },
    instance: null,
  };
  renderNginxGuideModal(nginxGuideState.proxy);
}

// 从 frps 实例配置里解析 vhostHTTPPort(当前详情页的 frps 实例)
function parseVhostPortFromConfig() {
  if (!detailInstance || !detailInstance.config_content) return null;
  const m = detailInstance.config_content.match(/vhostHTTPPort\s*=\s*(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

// frps 对 http/https 代理不返回 localPort, 此时不显示端口避免误导
function frpsProxyBackendText(proxy) {
  const ip = proxy.local_ip || '127.0.0.1';
  const port = proxy.local_port;
  return (port != null && port !== '' && port !== 0) ? `${ip}:${port}` : ip;
}

          <div class="p-2 bg-red-900/20 border border-red-700/40 rounded text-xs text-red-300">
            ⚠️ 未找到 frps 的 <span class="font-mono">vhostHTTPPort</span> 配置,无法生成 nginx 配置。<br>
            请先编辑本 frps 实例,添加 <span class="font-mono">vhostHTTPPort = 2006</span>(或其他空闲端口)。
          </div>`}
          <!-- SSL 开关 + 证书路径 -->
          <div class="flex items-center gap-3 p-2 bg-gray-800 rounded">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="nginx-ssl-toggle" checked onchange="updateNginxConfigPreview()" class="w-4 h-4">
              <span>启用 HTTPS</span>
            </label>
            <div id="nginx-cert-fields" class="flex-1 grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-gray-400 mb-1">证书路径</label>
                <input type="text" id="nginx-cert-path" value="${escapeHtml(defaultCertPath)}" oninput="updateNginxConfigPreview()" class="input text-xs">
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">密钥路径</label>
                <input type="text" id="nginx-key-path" value="${escapeHtml(defaultKeyPath)}" oninput="updateNginxConfigPreview()" class="input text-xs">
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">nginx 配置(可复制)</label>
            <textarea id="nginx-config-preview" readonly class="input font-mono text-xs nginx-preview-box">${escapeHtml(initialConfig)}</textarea>
          </div>

          <div class="flex gap-2">
            <button onclick="copyNginxConfig()" class="btn-primary text-xs flex-1">复制配置</button>
          </div>
        </div>
      </details>

      <!-- 步骤 2: 部署 -->
      <details class="mb-3 border border-gray-700 rounded">
        <summary class="p-3 cursor-pointer font-medium text-cyan-400">② 部署到 frps 主机</summary>
        <div class="p-3 pt-0 space-y-2 text-sm">
          <div class="p-2 bg-gray-800 rounded font-mono text-xs">
            <div class="text-gray-400 mb-1"># 1. 把上方配置保存为 nginx server block 文件</div>
            <div>vim /etc/nginx/conf.d/${escapeHtml(proxy.name.toLowerCase())}.conf</div>
            <div class="mt-2 text-gray-400 mb-1"># 2. 测试 nginx 配置</div>
            <div>nginx -t</div>
            <div class="mt-2 text-gray-400 mb-1"># 3. 重载 nginx</div>
            <div>nginx -s reload</div>
            <div class="mt-2 text-gray-400 mb-1"># 4. 验证(证书应与域名匹配)</div>
            <div>curl -I https://${escapeHtml(domains[0] || 'example.com')}</div>
          </div>
        </div>
      </details>
    </div>
  `;
  // 显示模态框(修复:之前忘了移除 hidden,导致内容渲染了但页面空白)
  document.getElementById('modal-container').classList.remove('hidden');
  document.getElementById('modal-container').classList.add('flex');
}

function generateNginxConfigLive() {
  const { proxy } = nginxGuideState;
  if (!proxy) return '';
  const ssl = document.getElementById('nginx-ssl-toggle')?.checked ?? true;
  const certPath = document.getElementById('nginx-cert-path')?.value || '';
  const keyPath = document.getElementById('nginx-key-path')?.value || '';
  const domains = proxy.custom_domains || [];

  // frp 链路架构: nginx -> frps 的 vhostHTTPPort(按域名路由) -> frpc -> 后端服务
  // vhostHTTPPort 从 frps 实例配置里取;取不到就不生成配置
  const vhostPort = nginxGuideState.vhostPort;
  if (!vhostPort) return '';

  let cfg = `# 由 frpm 生成 - ${new Date().toLocaleString()}\n`;
  cfg += `# 架构: 浏览器 -> nginx(${ssl?'TLS终结':'HTTP转发'}) -> frps vhostHTTPPort:${vhostPort} -> frpc -> ${frpsProxyBackendText(proxy)}\n`;
  cfg += `# 域名: ${domains.join(', ')}\n\n`;
  cfg += `map $http_upgrade $connection_upgrade {\n    default upgrade;\n    '' close;\n}\n\n`;
  cfg += `server {\n`;
  cfg += `    listen 80;\n`;
  if (ssl) {
    cfg += `    listen 443 ssl;\n`;
    cfg += `    server_name ${domains.join(' ')};\n\n`;
    cfg += `    ssl_certificate     ${certPath || '/etc/ssl/frpm/example.crt'};\n`;
    cfg += `    ssl_certificate_key ${keyPath || '/etc/ssl/frpm/example.key'};\n`;
    cfg += `    ssl_protocols TLSv1.2 TLSv1.3;\n    ssl_ciphers HIGH:!aNULL:!MD5;\n\n`;
  } else {
    cfg += `    server_name ${domains.join(' ')};\n\n`;
    cfg += `    # HTTPS 未启用,如需请修改证书路径后勾选\"启用 HTTPS\"\n\n`;
  }
  cfg += `    location / {\n`;
  cfg += `        # frps 的 vhostHTTPPort,按 Host 头(域名)路由到 frpc 代理\n`;
  cfg += `        proxy_pass http://127.0.0.1:${vhostPort};\n`;
  cfg += `        proxy_set_header Host $host;\n`;
  cfg += `        proxy_set_header X-Real-IP $remote_addr;\n`;
  cfg += `        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n`;
  cfg += `        proxy_set_header X-Forwarded-Proto $scheme;\n`;
  cfg += `        proxy_http_version 1.1;\n`;
  cfg += `        proxy_set_header Upgrade $http_upgrade;\n`;
  cfg += `        proxy_set_header Connection $connection_upgrade;\n`;
  cfg += `        proxy_read_timeout 3600s;\n`;
  cfg += `        proxy_send_timeout 3600s;\n`;
  cfg += `        proxy_buffering off;\n`;
  cfg += `    }\n`;
  cfg += `}\n`;
  return cfg;
}

function updateNginxConfigPreview() {
  // SSL 开关切换时,显示/隐藏证书路径输入框
  const sslChecked = document.getElementById('nginx-ssl-toggle')?.checked;
  const certFields = document.getElementById('nginx-cert-fields');
  if (certFields) {
    certFields.style.display = sslChecked ? 'grid' : 'none';
  }
  // 更新配置预览
  const preview = document.getElementById('nginx-config-preview');
  if (preview) preview.value = generateNginxConfigLive();
}

function copyNginxConfig() {
  const cfg = generateNginxConfigLive();
  navigator.clipboard.writeText(cfg).then(() => {
    toast('已复制到剪贴板', 'success');
  }).catch(() => {
    // fallback:用 textarea 选中
    const ta = document.getElementById('nginx-config-preview');
    ta.focus();
    ta.select();
    document.execCommand('copy');
    toast('已复制到剪贴板', 'success');
  });
}

// ============ 新增/编辑代理模态框 ============
let proxyModalState = { instanceId: null, proxyId: null, isEdit: false };

function showNewProxyModal(instanceId) {
  proxyModalState = { instanceId, proxyId: null, isEdit: false };
  renderProxyModal();
}

function showEditProxyModal(instanceId, proxyId) {
  proxyModalState = { instanceId, proxyId, isEdit: true };
  api(`/api/instances/${instanceId}/proxies`).then(data => {
    const proxy = (data.proxies || []).find(p => p.id === proxyId);
    if (!proxy) {
      toast('代理不存在', 'error');
      return;
    }
    proxyModalState.proxy = proxy;
    renderProxyModal();
  }).catch(e => {
    if (e && e.authExpired) return;
    toast(`加载代理失败: ${e.message}`, 'error');
  });
}

function renderProxyModal() {
  const { isEdit, proxy } = proxyModalState;
  const title = isEdit ? '编辑代理规则' : '新增代理规则';
  const p = proxy || {};

  document.getElementById('modal-container').innerHTML = `
    <div class="bg-gray-900 border border-gray-700 rounded-lg max-w-2xl w-[90%] max-h-[85vh] overflow-y-auto p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">${title}</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
      </div>
      <form id="proxyForm" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1">代理名 <span class="text-red-400">*</span></label>
            <input type="text" id="proxy-name" required pattern="^[a-zA-Z][a-zA-Z0-9_-]{1,30}$"
                   value="${p.name ? escapeHtml(p.name) : ''}" class="input">
            <p class="text-xs text-gray-500 mt-1">小写字母开头,可用字母数字下划线连字符</p>
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">代理类型 <span class="text-red-400">*</span></label>
            <select id="proxy-type" class="input" onchange="onProxyTypeChangeModal(this.value)">
              ${['tcp','udp','http','https','stcp','xtcp'].map(t =>
                `<option value="${t}" ${(p.type||'tcp')===t?'selected':''}>${t}</option>`
              ).join('')}
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1">本地 IP</label>
            <input type="text" id="proxy-local-ip" value="${p.local_ip || '127.0.0.1'}" class="input">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">本地端口 <span class="text-red-400">*</span></label>
            <input type="number" id="proxy-local-port" required value="${p.local_port || ''}" class="input">
          </div>
        </div>

        <div id="proxy-type-fields"></div>

        <div class="flex gap-2 justify-end pt-4 border-t border-gray-700">
          <button type="button" onclick="closeModal()" class="btn-ghost">取消</button>
          <button type="submit" class="btn-primary">${isEdit ? '保存' : '创建'}</button>
        </div>
      </form>
    </div>
  `;

  renderProxyTypeFields(p.type || 'tcp');
  document.getElementById('modal-container').classList.remove('hidden');
  document.getElementById('modal-container').classList.add('flex');
  document.getElementById('proxyForm').addEventListener('submit', submitProxy);
}

function renderProxyTypeFields(type) {
  const p = proxyModalState.proxy || {};
  const el = document.getElementById('proxy-type-fields');
  if (!el) return;
  let html = '';

  if (type === 'tcp' || type === 'udp') {
    html += `
      <div>
        <label class="block text-sm text-gray-400 mb-1">远程端口 <span class="text-red-400">*</span></label>
        <input type="number" id="proxy-remote-port" required value="${p.remote_port || ''}" class="input">
        <p class="text-xs text-gray-500 mt-1">frps 监听的公网端口,客户端通过此端口访问你的服务</p>
      </div>`;
  } else if (type === 'http' || type === 'https') {
    html += `
      <div class="p-3 bg-yellow-900/20 border border-yellow-700/40 rounded text-xs text-yellow-300 mb-2">
        ⚠️ 这种类型的代理<b>必须填一个域名</b>（下方"自定义域名"或"子域名"二选一），
        否则 frps 不知道把哪个网址的请求转发给你，代理会启动失败。
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">自定义域名 <span class="text-red-400">*</span></label>
        <input type="text" id="proxy-custom-domains" value="${p.custom_domains ? p.custom_domains.join(', ') : ''}" class="input">
        <p class="text-xs text-gray-500 mt-1">完整域名,多个用逗号分隔。如: vault.example.com, api.example.com</p>
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">子域名</label>
        <input type="text" id="proxy-subdomain" value="${p.subdomain || ''}" class="input">
        <p class="text-xs text-gray-500 mt-1">只填前缀,由 frps 自动拼域名。需服务器配了 subdomainHost 才可用。与自定义域名二选一</p>
      </div>`;
  } else if (type === 'stcp' || type === 'xtcp') {
    html += `
      <div>
        <label class="block text-sm text-gray-400 mb-1">密钥 <span class="text-red-400">*</span></label>
        <input type="text" id="proxy-secret-key" required value="${p.secret_key || ''}" class="input">
        <p class="text-xs text-gray-500 mt-1">点对点隧道密钥,客户端和服务端需使用相同密钥</p>
      </div>`;
  }

  document.getElementById('proxy-type-fields').innerHTML = html;
}

function onProxyTypeChangeModal(type) {
  renderProxyTypeFields(type);
}

async function submitProxy(e) {
  e.preventDefault();

  const instanceId = proxyModalState.instanceId;
  const isEdit = proxyModalState.isEdit;
  const proxyId = proxyModalState.proxyId;
  const original = (isEdit && proxyModalState.proxy) ? { ...proxyModalState.proxy } : {};

  // 编辑时保留原对象的所有字段(高级字段不在 UI 暴露,避免意外清空);
  // 新建时 data 只包含表单字段。
  const data = {
    ...original,
    name: document.getElementById('proxy-name').value.trim(),
    type: document.getElementById('proxy-type').value,
    local_ip: document.getElementById('proxy-local-ip').value.trim(),
    local_port: parseInt(document.getElementById('proxy-local-port').value, 10),
  };

  // 根据当前 type 显式设置/清空对应字段,避免切类型时残留旧值
  const type = data.type;
  if (type === 'tcp' || type === 'udp') {
    data.remote_port = parseInt(document.getElementById('proxy-remote-port').value, 10);
    // 清空其他类型专属字段
    delete data.custom_domains; delete data.subdomain; delete data.secret_key;
  } else if (type === 'http' || type === 'https') {
    const domains = document.getElementById('proxy-custom-domains').value.trim();
    const subdomain = document.getElementById('proxy-subdomain').value.trim();
    // frp 要求 http/https 代理必须有域名(customDomains 或 subdomain 二选一),否则代理启动失败
    if (!domains && !subdomain) {
      toast('http/https 代理必须填写域名:自定义域名或子域名二选一', 'error');
      return;
    }
    data.custom_domains = domains ? domains.split(',').map(s => s.trim()).filter(Boolean) : [];
    data.subdomain = subdomain || null;
    delete data.remote_port; delete data.secret_key;
  } else if (type === 'stcp' || type === 'xtcp') {
    data.secret_key = document.getElementById('proxy-secret-key').value.trim();
    delete data.remote_port; delete data.custom_domains; delete data.subdomain;
  }

  try {
    if (isEdit) {
      await api(`/api/instances/${instanceId}/proxies/${proxyId}`, {
        method: 'PUT',
        body: JSON.stringify(data),
        busy: '正在更新代理并重启实例...',
      });
      toast('代理已更新,实例重启中...', 'success');
    } else {
      await api(`/api/instances/${instanceId}/proxies`, {
        method: 'POST',
        body: JSON.stringify(data),
        busy: '正在创建代理并重启实例...',
      });
      toast('代理已创建,实例重启中...', 'success');
    }
    closeModal();
    // 刷新代理列表和实例列表
    if (expandedInstances[instanceId]) {
      await loadInstanceProxies(instanceId);
    }
    setTimeout(() => loadInstances(), 1500);
  } catch (err) {
    if (err && err.authExpired) return;  // 401 已跳登录
    toast(`保存失败: ${err.message}`, 'error');
  }
}

async function toggleProxy(instanceId, proxyId, enabled) {
  try {
    await api(`/api/instances/${instanceId}/proxies/${proxyId}/toggle`, {
      method: 'POST',
      body: JSON.stringify({ enabled }),
      busy: enabled ? '正在启用代理并重启实例...' : '正在禁用代理并重启实例...',
    });
    toast(enabled ? '已启用,实例重启中...' : '已禁用,实例重启中...', 'success');
    await loadInstanceProxies(instanceId);
    setTimeout(() => loadInstances(), 1500);
  } catch (err) {
    if (err && err.authExpired) return;
    toast(`操作失败: ${err.message}`, 'error');
  }
}

async function deleteProxy(instanceId, proxyId, name) {
  if (!confirm(`确定删除代理 "${name}" 吗?`)) return;
  try {
    await api(`/api/instances/${instanceId}/proxies/${proxyId}`, { method: 'DELETE', busy: '正在删除代理并重启实例...' });
    toast('代理已删除,实例重启中...', 'success');
    await loadInstanceProxies(instanceId);
    setTimeout(() => loadInstances(), 1500);
  } catch (err) {
    if (err && err.authExpired) return;
    toast(`删除失败: ${err.message}`, 'error');
  }
}

// ============ frps 详情页:删除离线代理 ============
// 入口在 frps 实例详情页的实时代理表里,只对离线代理显示删除按钮。
// 在线代理说明 frpc 还连着,删了配置会立刻重新注册回来,所以不显示。
async function deleteFrpsProxy(instanceId, name) {
  if (!confirm(`确定删除离线代理 "${name}" 吗?\n\n删除后会重启所属 frpc 实例并重新生成配置。`)) return;
  try {
    const r = await api(`/api/instances/${instanceId}/frps-proxies/${encodeURIComponent(name)}`, { method: 'DELETE', busy: '正在删除离线代理...' });
    toast(`已删除 ${name}(所属实例: ${r.instance}),实例重启中...`, 'success');
    await loadFrpsStatus(instanceId);
    setTimeout(() => loadInstances(), 1500);
  } catch (err) {
    if (err && err.authExpired) return;
    toast(`删除失败: ${err.message}`, 'error');
  }
}

// 页面初始化在 DOMContentLoaded 事件里(见上方),此处无额外入口。
